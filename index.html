<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Kem Sahabat Quran 2026</title>
  <meta http-equiv="refresh" content="0; url=web/">
  <link rel="canonical" href="web/">
  <style>
    :root {
      --forest: #073b2a;
      --emerald: #087443;
      --gold: #d6ad52;
      --cream: #f5f0e3;
      --ivory: #fffdf6;
      --muted: #5f7067;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(135deg, #05281d, var(--forest) 55%, #0a5136);
      color: var(--ivory);
      font-family: Inter, Arial, sans-serif;
      text-align: center;
    }

    .card {
      max-width: 34rem;
      padding: 28px 24px;
      border: 2px solid rgba(214, 173, 82, 0.7);
      border-radius: 16px;
      background: var(--cream);
      color: var(--forest);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.32);
    }

    h1 {
      margin: 0 0 10px;
      font-family: Cinzel, Georgia, serif;
      font-size: 1.5rem;
      letter-spacing: 0.04em;
    }

    p {
      margin: 0 0 14px;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      min-height: 44px;
      padding: 12px 22px;
      border-radius: 999px;
      background: var(--emerald);
      color: var(--ivory);
      font-weight: 700;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 3px;
    }

    small {
      display: block;
      margin-top: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Kem Sahabat Quran 2026</h1>
    <p>Laman sedang dibuka. Jika ia tidak bergerak secara automatik, tekan butang di bawah.</p>
    <a href="web/">Buka laman</a>
    <small>Masjid Kampung Sungai Lang Baru, Banting</small>
  </main>
  <script>
    // The meta refresh above already works without JavaScript. This script only
    // makes the jump instant and keeps the target relative to the deployment.
    window.location.replace('web/');
  </script>
</body>
</html>
